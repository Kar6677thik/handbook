# Full nginx config for the site's container.
# Runs as uid 101 on a read-only root filesystem: everything nginx writes goes to /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Caching is chosen by path here, so every header below can be set once at
    # server level. (A location with its own add_header would stop inheriting them.)
    map $uri $cache_control {
        ~^/_astro/  "public, max-age=31536000, immutable"; # fingerprinted assets never change
        default     "no-cache";                            # HTML revalidates, so deploys show at once
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control $cache_control always;

        # Security headers. Astro and Starlight ship small inline scripts and styles,
        # and the handbook's search (Pagefind) runs WebAssembly in a worker, hence
        # 'unsafe-inline', 'wasm-unsafe-eval' and blob: workers. Everything else
        # must come from this site.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location /_astro/ {
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ $uri.html =404;
        }

        # Health check for the cluster's probes.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        error_page 404 /404.html;
    }
}
