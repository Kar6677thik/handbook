# Build the handbook image, publish it to GHCR, then move :latest.
#
# Deployment is pull-based: an updater CronJob on the cluster (orbit-cloud,
# deploy/updater/handbook.yaml) checks :latest every ~5 minutes and rolls the
# handbook Deployment to that digest. So this workflow needs no deploy secrets;
# moving :latest IS the deploy. :latest is only moved after the image is pushed
# and attested, and only from main.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two runs race on :latest.
concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kar6677thik/handbook

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, for "Last updated" dates

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build and push the immutable :sha-<commit> tag only.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Attest build provenance for that digest.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # 3. Move :latest to the new digest. This is what triggers the deploy.
      - name: Promote to :latest
        if: github.ref == 'refs/heads/main'
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@${{ steps.build.outputs.digest }}"

      - name: Summary
        run: |
          {
            echo "### Image published"
            echo ""
            echo "\`$IMAGE@${{ steps.build.outputs.digest }}\`"
            echo ""
            echo "The cluster updater rolls book.karthiksurkanti.in to this digest within ~5 minutes."
          } >> "$GITHUB_STEP_SUMMARY"
